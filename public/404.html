<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CampusCare — Smart College Complaint Management Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Application redirect script for static hosts
      // Preserves path and query parameters when reloading routes
      sessionStorage.setItem('spa_redirect', window.location.pathname + window.location.search + window.location.hash);
      window.location.replace('/');
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #FFF5F9; color: #1E1B4B;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="color: #EC4899; margin-bottom: 8px;">Loading CampusCare...</h2>
      <p style="color: #64748B;">Redirecting to your session, please wait.</p>
    </div>
  </body>
</html>
